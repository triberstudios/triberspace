<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Triber Engine</title>
    <style>
        body {
            font-family: 'Work Sans', system-ui, -apple-system, sans-serif;
            background: #1a1a1a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            text-align: center;
            max-width: 600px;
        }
        h1 {
            font-size: 72px;
            margin: 0;
            color: #ff6b6b;
        }
        h2 {
            font-size: 24px;
            margin: 20px 0;
            font-weight: 400;
        }
        p {
            color: #aaa;
            line-height: 1.6;
        }
        a {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 24px;
            background: #ff6b6b;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            transition: background 0.3s;
        }
        a:hover {
            background: #ff5252;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <h2>Page Not Found</h2>
        <p>The page you're looking for doesn't exist or has been moved.</p>
        <a href="/">Return to Editor</a>
    </div>
</body>
</html>
